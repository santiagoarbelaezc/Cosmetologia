<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Estética Clinic — Sistema Clínico y Administrativo</title>
  <meta name="description" content="Sistema clínico, administrativo y de caja para centro de medicina estética y cosmetología">
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">

  <!-- Google Fonts: Plus Jakarta Sans -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400;1,500&display=swap" rel="stylesheet">

  <!-- AOS (Animate On Scroll) -->
  <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
</head>
<body class="font-sans">
  <app-root></app-root>
  <script src="https://unpkg.com/aos@next/dist/aos.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (window.AOS) {
        window.AOS.init({
          duration: 750,
          easing: 'ease-out-cubic',
          once: true,
          offset: 60,
        });
      }
    });
  </script>
</body>
</html>
